name: Trigger auto deployment for backend2

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main-upstream ]
    paths:
    - '**'
    - '.github/workflows/backend2-AutoDeployTrigger-c69b23ac-56e7-43cb-bcd5-cc80215918d4.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BACKEND2_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BACKEND2_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BACKEND2_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: fairacr.azurecr.io
          registryUsername: ${{ secrets.BACKEND2_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BACKEND2_REGISTRY_PASSWORD }}
          containerAppName: backend2
          resourceGroup: SH-DCR-FAIR-Dev-RG
          imageToBuild: fairacr.azurecr.io/backend2:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


